site_name: ait — Local attempt ledger for AI coding agents
site_url: https://m24927605.github.io/ait/
site_description: >-
  ait is a local attempt ledger for Claude Code, Codex CLI, Aider, Gemini CLI,
  Cursor CLI, and other AI coding agents. It records prompts, diffs, reviews,
  and decisions under .ait/ so another agent can review, continue, or recover
  the work later. Open source (MIT), Python 3.14+, no SaaS, no telemetry.
site_author: sin-chengchen
repo_url: https://github.com/m24927605/ait
repo_name: m24927605/ait
edit_uri: edit/main/site-docs/
copyright: MIT licensed.

docs_dir: site-docs

theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
  palette:
    scheme: slate
    primary: black
    accent: deep orange
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh-TW
          name: 繁體中文
          build: true
          site_name: ait — AI coding agents 的本機 attempt ledger
          nav_translations:
            Home: 首頁
            Why ait: 為什麼用 ait
            Getting started: 開始使用
            Demos: Demo
            Pain-point demos: 痛點 demo
            Integrations: 整合
            Claude Code: Claude Code
            Codex CLI: Codex CLI
            Aider: Aider
            Gemini CLI: Gemini CLI
            Cursor: Cursor
            Shell agents: Shell agents
            Compare: 比較
            "ait vs naked git-worktree": ait 對比裸 git-worktree
            "ait vs agent managers, memory layers, and review bots": ait 對比 agent managers、memory layers 與 review bots
            Facts: 事實
            Reference: 參考
            Commands: 指令
            Review modes: 審查模式
            Adversarial code review: 對抗式 code review
            Live federated memory: Live federated memory

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets

extra_css:
  - assets/ait-site.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/m24927605/ait
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/ait-vcs/
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/ait-vcs

nav:
  - Home: index.md
  - Why ait: why-ait.md
  - Getting started: getting-started.md
  - Demos:
      - Pain-point demos: demos/pain-point-demos.md
  - Integrations:
      - Claude Code: integrations/claude-code.md
      - Codex CLI: integrations/codex.md
      - Aider: integrations/aider.md
      - Gemini CLI: integrations/gemini.md
      - Cursor: integrations/cursor.md
      - Shell agents: integrations/shell.md
  - Compare:
      - "ait vs naked git-worktree": compare/git-worktree-naked-vs-ait.md
      - "ait vs agent managers, memory layers, and review bots": compare/agent-managers-memory-review-vs-ait.md
  - Reference:
      - Commands: reference/commands.md
      - Live federated memory: reference/live-federated-memory.md
      - Review modes: reference/review-modes.md
      - Adversarial code review: reference/adversarial-code-review.md
  - Facts: facts.md
