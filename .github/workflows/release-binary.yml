name: Release Binary

on:
  # release trigger intentionally removed 2026-05-29 — see
  # docs/superpowers/specs/2026-05-29-cicd-optimization-design.md and
  # memory/feedback_no_github_cicd_runs.md. Binary builds are now
  # opt-in: maintainer runs `gh workflow run release-binary.yml -f tag=vX.Y.Z`.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build for (e.g. v1.6.2). Required."
        required: true

permissions:
  contents: write   # needed by softprops/action-gh-release to attach assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          # macos-x86_64 dropped 2026-05-29: 10x runner cost + 15-30min
          # queue. Intel Mac users install via pip; see docs/install.md.
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller==6.*"
          python -m pip install -e .

      - name: Inject frozen version
        run: |
          python -c '
          import tomllib, pathlib
          data = tomllib.load(open("pyproject.toml","rb"))
          v = data["project"]["version"]
          pathlib.Path("src/ait/_frozen_version.py").write_text(
              f"__version__ = {v!r}\n", encoding="utf-8")
          '

      - name: Build binary
        run: |
          cd build
          pyinstaller --clean --noconfirm ait.spec

      - name: Rename binary
        run: |
          mkdir -p dist
          mv build/dist/ait dist/ait-${{ steps.tag.outputs.tag }}-${{ matrix.target }}

      - name: macOS ad-hoc sign
        if: startsWith(matrix.target, 'macos')
        run: |
          codesign --sign - --force --options runtime \
            dist/ait-${{ steps.tag.outputs.tag }}-${{ matrix.target }}

      - name: Smoke
        run: |
          python scripts/release-smoke/binary_smoke.py \
            dist/ait-${{ steps.tag.outputs.tag }}-${{ matrix.target }}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ait-${{ steps.tag.outputs.tag }}-${{ matrix.target }}
          tag_name: ${{ steps.tag.outputs.tag }}

  checksums:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - name: Download release binaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          gh release download "${{ steps.tag.outputs.tag }}" \
            -R "${{ github.repository }}" \
            -p 'ait-*-macos-arm64' \
            -p 'ait-*-linux-x86_64' \
            -p 'ait-*-linux-arm64' \
            -D dist/

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum ait-${{ steps.tag.outputs.tag }}-* \
            > ait-${{ steps.tag.outputs.tag }}-checksums.txt
          cat ait-${{ steps.tag.outputs.tag }}-checksums.txt

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ait-${{ steps.tag.outputs.tag }}-checksums.txt
          tag_name: ${{ steps.tag.outputs.tag }}

  update-tap:
    needs: checksums
    # Gated on a repo variable so the maintainer can flip it on once
    # m24927605/homebrew-ait + TAP_PUSH_TOKEN are set up. See
    # scripts/homebrew-tap-template/SETUP.md for the one-time setup.
    # Until then this job is skipped to avoid red CI on the binary
    # pipeline runs.
    if: vars.AIT_TAP_UPDATE_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          path: ait

      - name: Checkout tap repo
        uses: actions/checkout@v5
        with:
          repository: m24927605/homebrew-ait
          token: ${{ secrets.TAP_PUSH_TOKEN }}
          path: tap

      - name: Download checksums
        run: |
          curl -fsSL \
            "https://github.com/m24927605/ait/releases/download/${{ steps.tag.outputs.tag }}/ait-${{ steps.tag.outputs.tag }}-checksums.txt" \
            -o checksums.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Render formula
        run: |
          python ait/scripts/release-smoke/render_brew_formula.py \
            --version "${{ steps.tag.outputs.tag }}" \
            --checksums checksums.txt \
            --output tap/Formula/ait.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.email "release-bot@users.noreply.github.com"
          git config user.name "release-bot"
          git add Formula/ait.rb
          if git diff --cached --quiet; then
            echo "No changes — formula already up to date."
            exit 0
          fi
          git commit -m "ait ${{ steps.tag.outputs.tag }}"
          git push
