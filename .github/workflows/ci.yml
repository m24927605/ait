name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Configure git identity for tests that shell out to git commit
        # Several tests (cli_demo, daemon_e2e, federated_recall, etc.) create
        # temp git repos and run `git commit`. Hosted runners ship with no
        # user.email/user.name, so the commit fails with "Author identity
        # unknown" — and the failure is silent (the tests just see exit 128).
        # Set a stable CI identity globally so every subprocess inherits it.
        run: |
          git config --global user.email "ci@ait.test"
          git config --global user.name "AIT CI"

      - name: Run tests
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run npm package tests
        run: npm --prefix npm/ait-vcs test

  release-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install release smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine pytest

      - name: Check package metadata consistency
        run: python scripts/release-smoke/check_package_metadata.py

      - name: Run release smoke tests
        run: python -m pytest tests/test_release_smoke.py -q

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke installed wheel
        run: python scripts/release-smoke/wheel_smoke.py --dist-dir dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run npm package tests
        run: npm --prefix npm/ait-vcs test

      - name: Check npm package dry run
        working-directory: npm/ait-vcs
        run: npm pack --dry-run

      - name: Smoke npm local tarball install
        run: python scripts/release-smoke/npm_tarball_smoke.py --package-dir npm/ait-vcs --dist-dir dist
