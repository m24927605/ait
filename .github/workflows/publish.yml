name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install release smoke dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Check package metadata consistency
        run: python scripts/release-smoke/check_package_metadata.py

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Smoke installed wheel
        run: python scripts/release-smoke/wheel_smoke.py --dist-dir dist

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run npm package tests
        run: npm --prefix npm/ait-vcs test

      - name: Check npm package dry run
        working-directory: npm/ait-vcs
        run: npm pack --dry-run

      - name: Smoke npm local tarball install
        run: python scripts/release-smoke/npm_tarball_smoke.py --package-dir npm/ait-vcs --dist-dir dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
